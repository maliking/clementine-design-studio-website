# Netlify settings, so nothing has to be typed in on the Netlify side.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The real site (main branch) is the only one search engines may list. Deploy Previews keep "noindex".
[context.production.environment]
  SITE_LIVE = "true"

# maliking.com (Mali's older domain) moved off Squarespace 11/25: every address on it goes to the same page here.
# These must stay the first rules in the file.
[[redirects]]
  from = "https://maliking.com/*"
  to = "https://clementinedesign.studio/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://maliking.com/*"
  to = "https://clementinedesign.studio/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.maliking.com/*"
  to = "https://clementinedesign.studio/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.maliking.com/*"
  to = "https://clementinedesign.studio/:splat"
  status = 301
  force = true

# The old Squarespace site had a copy of the home page at /home.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# ---- JuiceKit demo (added 11/25) ----
# The demo stays on Mali's Squarespace site until it has a new home. After clementinedesign.studio
